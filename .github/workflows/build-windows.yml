name: "Build Windows Installer"

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo decidir si correspondería un release; no compilar ni publicar"
        type: boolean
        required: false
        default: false

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.gate.outputs.should_release }}
      release_tag: ${{ steps.gate.outputs.release_tag }}
      previous_tag: ${{ steps.gate.outputs.previous_tag }}
      target_sha: ${{ steps.bump.outputs.target_sha || steps.gate.outputs.target_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run release gate
        id: gate
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: |
          bash scripts/release-gate.sh | tee release-gate.out
          cat release-gate.out >> "$GITHUB_OUTPUT"

      # Los chequeos y los tests de abajo corren siempre, aunque el gate decida que no
      # corresponde release: son baratos en ubuntu y avisan de un archivo roto antes de
      # que el proximo push intente publicar. Lo unico condicionado es el bump, que
      # commitea y pushea.
      - name: Syntax-check frontend modules
        shell: bash
        run: |
          set -euo pipefail
          # Estos modulos usan `export` y se sirven tal cual, sin bundler, asi que hay
          # que parsearlos como ESM: `node --check` decide por la extension, y por eso
          # cada archivo se copia a un .mjs temporal.
          #
          # Nota historica, porque esto se diagnostico mal cuatro veces seguidas: se
          # creyo que el problema era Node (que si no parseaba ESM) y se cambiaron el
          # parser y la version de Node sin necesidad. La causa era el archivo: el
          # app-shell.js commiteado tenia los helpers metidos dentro de una funcion.
          # Los commits "el chequeo de sintaxis no funcionaba en Node 20" y "Node 24 en
          # lugar de 20" dicen cualquier cosa; este chequeo tenia razon las 4 veces.
          # Si vuelve a fallar, lo mas probable es que el archivo este mal.
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          fallidos=0
          while IFS= read -r file; do
            cp "$file" "$tmp_dir/check.mjs"
            if node --check "$tmp_dir/check.mjs"; then continue; fi
            echo "::error::Error de sintaxis en $file"
            fallidos=$((fallidos + 1))
          done < <(git ls-files 'src/**/*.js' 'src/*.js')
          if [ "$fallidos" -gt 0 ]; then
            echo "$fallidos modulo(s) con error de sintaxis"
            exit 1
          fi
          echo "Sintaxis OK en todos los modulos del frontend"

      - name: Test release gate
        shell: bash
        run: bash scripts/test-release-gate.sh

      - name: Test release bump
        shell: bash
        run: bash scripts/test-ci-bump-release.sh

      # Hasta ahora el unico test que corria en CI era `cargo test`: estos dos modulos
      # tienen 21 tests propios que no los ejecutaba nadie.
      - name: Test frontend modules
        shell: bash
        run: node --test "src/**/*.test.js"

      - name: Bump release version
        id: bump
        if: steps.gate.outputs.should_release == 'true' && steps.gate.outputs.release_version != ''
        shell: bash
        run: |
          bash scripts/ci-bump-release.sh "${{ steps.gate.outputs.release_version }}"
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-tauri:
    runs-on: windows-latest
    needs: prepare-release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Frontend Dependencies
        run: npm install

      # tauri-action detecta el gestor de paquetes por el lockfile: este repo
      # tiene bun.lock, asi que construye con `bun tauri build` y necesita bun
      # instalado aunque el workflow no lo invoque directamente.
      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check updater signing configuration
        if: needs.prepare-release.outputs.should_release == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or
              [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Configure both updater signing secrets before building a release."
          }

      - name: Generate release notes
        id: notes
        shell: pwsh
        env:
          PREVIOUS_TAG: ${{ needs.prepare-release.outputs.previous_tag }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $fallback = "Esta versión trae mejoras internas y correcciones menores."
          $features = @()
          $fixes = @()
          $previous = $env:PREVIOUS_TAG
          $range = if ([string]::IsNullOrWhiteSpace($previous)) { "HEAD" } else { "$previous..HEAD" }

          foreach ($subject in @(git log --no-merges --format=%s $range)) {
            if ($subject -match '^(?<type>feat|fix)(\([^)]*\))?!?:\s*(?<text>.+)$') {
              $text = $Matches['text'].Trim()
              if ($text.Length -gt 0) {
                $text = $text.Substring(0, 1).ToUpper() + $text.Substring(1)
                if ($Matches['type'] -eq 'feat') { $features += "- $text" } else { $fixes += "- $text" }
              }
            }
          }

          $sections = @()
          if ($features.Count -gt 0) { $sections += (@("Novedades") + $features) -join "`n" }
          if ($fixes.Count -gt 0) { $sections += (@("Correcciones") + $fixes) -join "`n" }
          $notes = if ($sections.Count -gt 0) { $sections -join "`n`n" } else { $fallback }
          $instructions = @"
          Instalador de la aplicación para Windows. Descarga el archivo de abajo para instalar.

          **Si Windows bloquea la instalación:**
          1. Click derecho en el archivo → Propiedades
          2. Abajo a la derecha, marca "Desbloquear"
          3. Aplica los cambios
          4. Ejecuta el instalador
          "@
          $body = ($notes.Trim(), $instructions.Trim()) -join "`n`n"
          Write-Host $body
          "body<<RELEASE_BODY_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "RELEASE_BODY_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Tauri App
        if: needs.prepare-release.outputs.should_release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Prestamo de Equipos v__VERSION__ - Windows"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc
