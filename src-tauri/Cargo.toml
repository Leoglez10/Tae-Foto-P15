[package]
name = "prestamos-equipos-tauri"
version = "0.1.0"
description = "Aplicacion local de prestamo de equipos"
authors = ["Leonardo Gonzalez"]
edition = "2021"

[lib]
name = "prestamos_equipos_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
calamine = "0.26"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.1.1", features = [] }
thiserror = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# Envío de los reportes de problemas al Worker (ver worker/README.md).
# 0.13 y no 0.12: tauri-plugin-updater ya trae reqwest 0.13, así no se compilan
# dos stacks de reqwest en el mismo binario. rustls evita depender de OpenSSL en Windows.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
